<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1b2e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
<title>Escritor IA</title>
<style>
:root{--bg:#15131f;--card:#221f33;--line:#352f4d;--txt:#ece9f7;--mut:#9a94b8;--acc:#8b7cf6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:16px system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:var(--acc);border-color:var(--acc)}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
header h1{flex:1;font-size:17px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:10px 12px;border-radius:14px;background:var(--card);white-space:pre-wrap;word-break:break-word;line-height:1.45}
.m.user{align-self:flex-end;background:#3a3166}
.m small{display:block;margin-top:8px}
.m small button{font-size:13px;padding:4px 9px;margin-right:6px}
.m textarea{width:100%;min-height:140px}
#bar{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;align-items:center}
textarea,input{width:100%;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
#txt{min-height:70px;max-height:35vh;resize:vertical}
#sites{display:none}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:5}
.panel.show{display:block}
.panel>div{background:var(--bg);width:min(420px,92%);height:100%;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.panel.c>div{margin-left:auto}
.item{display:flex;gap:6px}
.item button:first-child{flex:1;text-align:left}
.empty{color:var(--mut);text-align:center;margin-top:30%}
</style>
</head>
<body>
<header>
  <button id="bMenu">☰</button>
  <h1 id="title">Escritor IA</h1>
  <button id="bMem">🧠</button>
  <button id="bSet">⚙️</button>
</header>

<div id="chat"></div>

<div id="bar">
  <div class="row">
    <button id="tSearch">🔎 Pesquisa</button>
    <button id="tDeep">🔬 Pesquisa profunda</button>
  </div>
  <input id="sites" placeholder="Sites ou wikis (separe com vírgula). Ex: pt.wikipedia.org, fandom.com">
  <textarea id="txt" placeholder="Escreva aqui... (sem limite de texto)"></textarea>
  <div class="row"><button class="p" id="bSend" style="flex:1">Enviar</button></div>
</div>

<!-- Projetos -->
<div class="panel" id="pMenu"><div>
  <div class="row"><b style="flex:1">Projetos</b><button id="xMenu">✕</button></div>
  <button class="p" id="bNew">+ Criar projeto</button>
  <div id="list"></div>
</div></div>

<!-- Memória -->
<div class="panel c" id="pMem"><div>
  <div class="row"><b style="flex:1">Memória deste projeto</b><button id="xMem">✕</button></div>
  <small style="color:var(--mut)">Só este projeto usa esta memória. A IA lê tudo daqui.</small>
  <textarea id="memTxt" style="flex:1;min-height:50vh"></textarea>
  <button class="p" id="saveMem">Salvar memória</button>
</div></div>

<!-- Configurações -->
<div class="panel c" id="pSet"><div>
  <div class="row"><b style="flex:1">Configurações</b><button id="xSet">✕</button></div>
  <label>Chave da API (Anthropic)</label>
  <input id="key" type="password" placeholder="sk-ant-...">
  <button class="p" id="saveSet">Salvar</button>
  <small style="color:var(--mut)">A chave fica só no seu celular.</small>
</div></div>

<script>
/* ---------- Banco de dados (IndexedDB: guarda texto enorme) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((ok, err) => {
      const r = indexedDB.open('escritor-ia', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; ok(); };
      r.onerror = () => err(r.error);
    });
  },
  get(k) {
    return new Promise(ok => {
      const q = this.db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => ok(q.result);
      q.onerror = () => ok(undefined);
    });
  },
  set(k, v) {
    return new Promise(ok => {
      const t = this.db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = () => ok();
    });
  },
  del(k) {
    return new Promise(ok => {
      const t = this.db.transaction('kv', 'readwrite');
      t.objectStore('kv').delete(k);
      t.oncomplete = () => ok();
    });
  }
};

/* ---------- Estado ---------- */
let meta = { ids: [], current: null, key: '' };
let proj = null;          // projeto aberto
let useSearch = false, useDeep = false, busy = false;
const $ = id => document.getElementById(id);

const saveMeta = () => DB.set('meta', meta);
const saveProj = () => DB.set('p:' + proj.id, proj);

async function openProject(id) {
  proj = await DB.get('p:' + id);
  meta.current = id;
  await saveMeta();
  $('title').textContent = proj.name;
  render();
}

async function newProject() {
  const name = prompt('Nome do projeto:');
  if (!name) return;
  const p = { id: 'p' + Date.now(), name: name.trim(), memory: '', messages: [] };
  await DB.set('p:' + p.id, p);
  meta.ids.push(p.id);
  await openProject(p.id);
  closeAll();
}

async function renderList() {
  const box = $('list');
  box.innerHTML = '';
  for (const id of meta.ids) {
    const p = await DB.get('p:' + id);
    if (!p) continue;
    const row = document.createElement('div');
    row.className = 'item';
    row.style.marginTop = '8px';
    const b = document.createElement('button');
    b.textContent = (id === meta.current ? '● ' : '') + p.name;
    b.onclick = async () => { await openProject(id); closeAll(); };
    const r = document.createElement('button');
    r.textContent = '✏️';
    r.onclick = async () => {
      const n = prompt('Novo nome:', p.name);
      if (!n) return;
      p.name = n.trim();
      await DB.set('p:' + id, p);
      if (proj && proj.id === id) { proj.name = p.name; $('title').textContent = p.name; }
      renderList();
    };
    const d = document.createElement('button');
    d.textContent = '🗑️';
    d.onclick = async () => {
      if (!confirm('Apagar "' + p.name + '" e tudo dentro?')) return;
      await DB.del('p:' + id);
      meta.ids = meta.ids.filter(x => x !== id);
      if (meta.current === id) {
        meta.current = meta.ids[0] || null;
        if (meta.current) await openProject(meta.current); else { proj = null; render(); }
      }
      await saveMeta();
      renderList();
    };
    row.append(b, r, d);
    box.append(row);
  }
}

/* ---------- Tela do chat ---------- */
function render() {
  const chat = $('chat');
  chat.innerHTML = '';
  if (!proj) {
    chat.innerHTML = '<div class="empty">Crie um projeto<br>para começar.</div>';
    $('title').textContent = 'Escritor IA';
    return;
  }
  if (!proj.messages.length) chat.innerHTML = '<div class="empty">Escreva algo para começar.</div>';
  proj.messages.forEach((m, i) => chat.append(bubble(m, i)));
  chat.scrollTop = chat.scrollHeight;
}

function bubble(m, i) {
  const d = document.createElement('div');
  d.className = 'm ' + m.role;
  const t = document.createElement('span');
  t.textContent = m.content;
  d.append(t);
  const s = document.createElement('small');
  const ed = document.createElement('button');
  ed.textContent = '✏️ Editar';
  ed.onclick = () => editMsg(d, m);
  const cp = document.createElement('button');
  cp.textContent = '📋 Copiar';
  cp.onclick = () => navigator.clipboard && navigator.clipboard.writeText(m.content);
  s.append(ed, cp);
  if (m.role === 'assistant') {
    const mem = document.createElement('button');
    mem.textContent = '🧠 Guardar';
    mem.onclick = async () => {
      proj.memory += (proj.memory ? '\n\n' : '') + m.content;
      await saveProj();
      mem.textContent = '✔ Guardado';
    };
    s.append(mem);
  }
  d.append(s);
  return d;
}

function editMsg(d, m) {
  d.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.value = m.content;
  const ok = document.createElement('button');
  ok.className = 'p';
  ok.textContent = 'Salvar';
  ok.onclick = async () => { m.content = ta.value; await saveProj(); render(); };
  const no = document.createElement('button');
  no.textContent = 'Cancelar';
  no.onclick = render;
  d.append(ta, ok, no);
}

/* ---------- Enviar para a IA ---------- */
async function send() {
  if (busy) return;
  if (!proj) return alert('Crie um projeto primeiro.');
  if (!meta.key) { openPanel('pSet'); return; }
  const text = $('txt').value;
  if (!text.trim()) return;
  $('txt').value = '';
  proj.messages.push({ role: 'user', content: text });
  await saveProj();
  render();

  busy = true;
  $('bSend').textContent = 'Pensando...';
  try {
    const answer = await askAI();
    proj.messages.push({ role: 'assistant', content: answer });
  } catch (e) {
    proj.messages.push({ role: 'assistant', content: '⚠️ Erro: ' + e.message });
  }
  await saveProj();
  busy = false;
  $('bSend').textContent = 'Enviar';
  render();
}

async function askAI() {
  // A IA lê só as mensagens mais recentes (limite da janela dela).
  // Tudo continua guardado no celular.
  let size = 0, msgs = [];
  for (let i = proj.messages.length - 1; i >= 0; i--) {
    const m = proj.messages[i];
    size += m.content.length;
    if (size > 400000 && msgs.length) break;
    msgs.unshift({ role: m.role, content: m.content });
  }
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();

  let system = 'Você é um assistente de escrita criativa. Responda em português do Brasil.';
  if (proj.memory.trim()) system += '\n\nMEMÓRIA DESTE PROJETO (use sempre):\n' + proj.memory;
  if (useDeep) system += '\n\nFaça PESQUISA PROFUNDA: busque várias vezes, compare fontes e escreva uma resposta completa.';

  const body = { model: 'claude-sonnet-5-5', max_tokens: 8000, system, messages: msgs };

  if (useSearch || useDeep) {
    const tool = { type: 'web_search_20250305', name: 'web_search', max_uses: useDeep ? 15 : 3 };
    const sites = $('sites').value.split(',').map(s => s.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '')).filter(Boolean);
    if (sites.length) tool.allowed_domains = sites;
    body.tools = [tool];
  }

  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': meta.key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });
  const data = await r.json();
  if (!r.ok) throw new Error((data.error && data.error.message) || r.status);
  return data.content.filter(b => b.type === 'text').map(b => b.text).join('') || '(sem resposta)';
}

/* ---------- Painéis e botões ---------- */
function openPanel(id) { closeAll(); $(id).classList.add('show'); }
function closeAll() { document.querySelectorAll('.panel').forEach(p => p.classList.remove('show')); }

$('bMenu').onclick = () => { renderList(); openPanel('pMenu'); };
$('bMem').onclick = () => {
  if (!proj) return alert('Crie um projeto primeiro.');
  $('memTxt').value = proj.memory;
  openPanel('pMem');
};
$('bSet').onclick = () => { $('key').value = meta.key; openPanel('pSet'); };
['xMenu', 'xMem', 'xSet'].forEach(id => $(id).onclick = closeAll);
$('bNew').onclick = newProject;
$('saveMem').onclick = async () => { proj.memory = $('memTxt').value; await saveProj(); closeAll(); };
$('saveSet').onclick = async () => { meta.key = $('key').value.trim(); await saveMeta(); closeAll(); };
$('bSend').onclick = send;

function syncToggles() {
  $('tSearch').classList.toggle('on', useSearch);
  $('tDeep').classList.toggle('on', useDeep);
  $('sites').style.display = (useSearch || useDeep) ? 'block' : 'none';
}
$('tSearch').onclick = () => { useSearch = !useSearch; syncToggles(); };
$('tDeep').onclick = () => { useDeep = !useDeep; syncToggles(); };

/* ---------- Início ---------- */
(async () => {
  await DB.open();
  const saved = await DB.get('meta');
  if (saved) meta = saved;
  if (meta.current && meta.ids.includes(meta.current)) await openProject(meta.current);
  else render();
  syncToggles();
})();
</script>
</body>
</html>
