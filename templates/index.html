<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101323">
    <title>Knowledge Hub</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icons/icon.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
    <button id="menuBtn">☰</button>
    <h2>⌕ Knowledge Hub</h2>
    <button id="themeBtn">☼</button>
</header>

<aside class="sidebar" id="sidebar">
    <button id="newProjectBtn">＋ Novo projeto</button>
    <h3>MEUS PROJETOS</h3>
    <div id="projectList"></div>
</aside>

<main class="main">

    <section id="welcome">
        <h1>Seu espaço de conhecimento.</h1>
        <p>Pesquise, escreva e organize suas ideias.</p>
        <button id="welcomeProject">Criar projeto</button>
    </section>

    <section id="workspace" hidden>
        <h2 id="projectTitle"></h2>

        <nav class="tabs">
            <button class="tab active" data-tab="search">Pesquisa</button>
            <button class="tab" data-tab="editor">Editor</button>
            <button class="tab" data-tab="memory">Memória</button>
        </nav>

        <section id="searchPanel" class="panel">
            <h2>Pesquisa na internet</h2>
            <input id="searchInput" placeholder="O que deseja pesquisar?">
            <input id="siteInput" placeholder="Sites específicos (ex: wikipedia.org)">

            <button id="searchBtn">Pesquisa normal</button>
            <button id="deepSearchBtn">Pesquisa profunda</button>

            <div id="searchResults"></div>
        </section>

        <section id="editorPanel" class="panel" hidden>
            <h2>Editor de textos</h2>
            <textarea id="textEditor" placeholder="Escreva seu texto..."></textarea>
            <button id="saveTextBtn">Salvar texto</button>
            <div id="savedTexts"></div>
        </section>

        <section id="memoryPanel" class="panel" hidden>
            <h2>Memória do projeto</h2>
            <textarea id="projectMemory" placeholder="Informações importantes deste projeto..."></textarea>
            <button id="saveMemoryBtn">Salvar memória</button>
        </section>

    </section>
</main>

<script src="/static/app.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
